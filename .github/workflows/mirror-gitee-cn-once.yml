name: One-time isolated Guangzhou release mirror
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  notes:
    runs-on: [self-hosted, linux, x64, bianbian-gitee-once-060]
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GITEE_REPO: ${{ secrets.GITEE_REPO }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - name: Synchronize Chinese registration notice
        shell: bash
        run: |
          python3 -u - <<'PY'
          import json, os, re, time, urllib.request, urllib.parse
          tag = os.environ['RELEASE_TAG']
          repo = os.environ['GITEE_REPO']
          assert re.fullmatch(r'v[0-9]+[.][0-9]+[.][0-9]+', tag)
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repo)
          def read(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'EncryptedReleaseMirror/1.0'}), timeout=30) as response:
                  return json.load(response)
          source = read(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}")
          assert not source['draft'] and not source['prerelease']
          base = f'https://gitee.com/api/v5/repos/{repo}/releases'
          target = read(base + '/tags/' + tag + '?fresh=' + str(time.time_ns()))
          assert sum(a.get('name') == 'payload.7z' for a in target['assets']) == 1
          body = urllib.parse.urlencode({'tag_name':tag,'name':source['name'],'body':source['body']}).encode()
          request = urllib.request.Request(base + '/' + str(int(target['id'])), data=body, method='PATCH',
              headers={'Authorization':'Bearer ' + os.environ['GITEE_TOKEN'],'Content-Type':'application/x-www-form-urlencoded','User-Agent':'EncryptedReleaseMirror/1.0'})
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          assert result['tag_name'] == tag and result['body'] == source['body']
          print('Chinese release notes synchronized successfully.')
          PY
