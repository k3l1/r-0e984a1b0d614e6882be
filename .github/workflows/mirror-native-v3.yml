name: Mirror signed native v3
run-name: Mirror native v3 ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published native version tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: native-mirror-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GITEE_REPO: ${{ secrets.GITEE_REPO }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography
      - name: Verify signatures, mirror packages, then promote Gitee channel
        run: python native_release/mirror_native.py
